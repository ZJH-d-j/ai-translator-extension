<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 网页翻译 - 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f3f4f6;
      color: #1f2329;
      padding: 32px 16px;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .desc { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    .field .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 20px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-secondary { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .btn-secondary:hover:not(:disabled) { background: #dbeafe; }
    .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .status.ok { color: #16a34a; }
    .status.error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h1>API 设置</h1>
    <p class="desc">兼容 OpenAI 协议的服务均可使用（如 DeepSeek、通义、Kimi、自建网关等）</p>

    <div class="field">
      <label for="baseUrl">Base URL</label>
      <input id="baseUrl" type="text" placeholder="https://api.deepseek.com">
      <div class="hint">接口基础地址，可带 /v1，插件会自动拼接 /chat/completions</div>
    </div>

    <div class="field">
      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" placeholder="sk-...">
    </div>

    <div class="field">
      <label for="model">模型</label>
      <input id="model" type="text" placeholder="deepseek-v4-flash">
    </div>

    <div class="btn-row">
      <button id="saveBtn" class="btn btn-primary">保存</button>
      <button id="testBtn" class="btn btn-secondary">测试连接</button>
    </div>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
